[package]
name = "mining-sim"
version = "0.1.0"
edition = "2021"

[features]
contact-history = ["rapier3d/serde-serialize", "dep:bincode"]

[dependencies]
sim3d = { path = "../sim3d" }
glam = { workspace = true, features = ["serde"] }
serde = { workspace = true }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
bincode = { version = "=1.3.3", optional = true }

# Single-threaded machine contacts; original water/riffle solvers remain separate.
rapier3d = { version = "=0.36.1", features = ["enhanced-determinism"] }

[[example]]
name = "retained_soil_replay"
required-features = ["contact-history"]

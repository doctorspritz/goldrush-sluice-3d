[package]
name = "mining-sim"
version = "0.1.0"
edition = "2021"

[dependencies]
sim3d = { path = "../sim3d" }
glam = { workspace = true, features = ["serde"] }
serde = { workspace = true }
serde_json = { version = "1.0", features = ["float_roundtrip"] }

# Single-threaded machine contacts; original water/riffle solvers remain separate.
rapier3d = { version = "=0.36.1", features = ["enhanced-determinism"] }

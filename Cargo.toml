[workspace]
resolver = "2"
members = [
  "crates/sim3d",
  "crates/game",
  "crates/mining-sim",
  "crates/mining",
  "crates/mining-physics",
]

default-members = [
  "crates/game",
]

[workspace.dependencies]
glam = "0.27"
serde = { version = "1.0", features = ["derive"] }
bytemuck = { version = "1.14", features = ["derive"] }

[profile.playable]
inherits = "release"
opt-level = 2
codegen-units = 16
lto = false

# Optimize the CPU solvers without rebuilding all rendering dependencies.
[profile.playable.package.sim3d]
opt-level = 3
[profile.playable.package.mining-sim]
opt-level = 3
[profile.playable.package.mining-physics]
opt-level = 3
